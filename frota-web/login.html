<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetManager Pro - Login Corporativo</title>
    <link rel="stylesheet" href="fleet-style.css">
    <style>
        /* Estilos específicos para a tela de login centralizada */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-dark);
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            padding: 30px;
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
            text-align: center;
        }
        .login-card h2 {
            margin-bottom: 5px;
            color: #fff;
        }
        .login-card h2 span {
            color: var(--neon-blue);
        }
        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 25px;
        }
        .form-group {
            text-align: left;
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            margin-bottom: 6px;
            letter-spacing: 0.5px;
        }
        .form-group input, .form-group select {
            width: 100%;
            background: #111;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 8px;
            color: #fff;
            font-size: 0.9rem;
        }
        .form-group input:focus, .form-group select:focus {
            border-color: var(--neon-blue);
            outline: none;
        }
        .btn-login {
            width: 100%;
            background-color: var(--neon-blue);
            color: #0d0d0d;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 0.95rem;
            cursor: pointer;
            margin-top: 15px;
            transition: opacity 0.2s;
        }
        .btn-login:hover {
            opacity: 0.9;
        }
        .error-msg {
            color: var(--alert-red);
            font-size: 0.8rem;
            margin-top: 15px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Fleet<span>Manager</span></h2>
        <p>Acesso Restrito ao Ecossistema Corporativo</p>

        <form id="login-form" onsubmit="realizarLogin(event)">
            <div class="form-group">
                <label>E-mail Corporativo</label>
                <input type="email" id="email" required placeholder="gestor@empresa.com">
            </div>

            <div class="form-group">
                <label>Senha de Acesso</label>
                <input type="password" id="senha" required placeholder="••••••••">
            </div>

            <div class="form-group">
                <label>Perfil de Acesso (Simulação RBAC)</label>
                <select id="perfil">
                    <option value="ROLE_FLEET_MANAGER">Gestor de Frotas (Cliente B2B)</option>
                    <option value="ROLE_ADMIN">Administrador Master (Equipe)</option>
                </select>
            </div>

            <button type="submit" class="btn-login">Entrar na Central</button>
            <div id="error-msg" class="error-msg">Credenciais inválidas. Tente novamente.</div>
        </form>
    </div>

    <script src="auth.js"></script>
</body>
</html>
